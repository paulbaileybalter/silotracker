<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silo Grain Tracker · Balter Brewing</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#47D7AC">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preload" href="fonts/lexend-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div class="bubbles" id="bubbles" aria-hidden="true"></div>
<header class="topbar">
  <div class="header-in">
    <img class="logo" src="assets/logo.svg" alt="Balter Brewing" width="44" height="44">
    <div class="brand">
      <span class="kicker">Balter Brewing · Supply Planning</span>
      <h1>Silo Grain Tracker</h1>
    </div>
    <div class="spacer"></div>
    <div class="actions top-actions">
      <span class="pill" title="Save status"><span class="dot busy" id="syncDot"></span><span id="syncText">Loading…</span><button class="btn btn--sm" id="syncNow" type="button" style="border:none;padding:2px 6px" aria-label="Check for updates from another device">↻</button></span>
      <button class="btn btn--primary" id="importBtn" type="button">Upload latest ST26</button>
      <input type="file" id="importFile" accept=".xlsx,.xlsm" hidden>
      <input type="file" id="archiveFile" accept=".xlsx,.xlsm" hidden>
      <a class="btn" href="/_auth/logout">Log out</a>
    </div>
  </div>
  <nav class="tabs jump" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="grain" aria-selected="true">Grain silos</button>
    <button class="tab" role="tab" data-tab="history" aria-selected="false">Silo history</button>
    <button class="tab" role="tab" data-tab="settings" aria-selected="false">Settings</button>
  </nav>
</header>
<main class="page">
  <section id="tab-grain" role="tabpanel"></section>
  <section id="tab-history" role="tabpanel" hidden></section>
  <section id="tab-settings" role="tabpanel" hidden></section>
  <footer class="foot">Balter Brewing · Silo grain tracker · Estimates, bookings and settings are saved to the shared store; use Backup in Settings for a copy. <a href="/_auth/logout">Sign out</a></footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/st26-parser.js"></script>
<script src="js/forecast.js"></script>
<script src="js/charts.js"></script>
<script src="js/core.js"></script>
<script src="js/grain.js"></script>
<script src="js/history.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
</body>
</html>
